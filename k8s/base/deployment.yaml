apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-record
  labels:
    app.kubernetes.io/name: backend-record
spec:
  # replicas 는 overlay 에서 환경별로 지정 (dev=1, prod=2 — prod 는 현재 주석 상태)
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-record
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-record
    spec:
      # IRSA: 위 ServiceAccount(backend-record)에 연결된 IAM Role 로
      # AWS Bedrock 을 호출한다. Secret 의 정적 AWS 키는 더 이상 불필요.
      serviceAccountName: backend-record
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # CLIAR-123: backend-record는 CLOVA OCR 전용 서비스로, Scrap 저장을
      # 포함한 PostgreSQL 데이터 소유 책임이 없다(CLIAR-121). 따라서 Pod
      # 시작 전 Alembic migration을 수행하는 initContainer를 제거했다.
      # FastAPI container는 DB migration 성공 여부와 무관하게 시작된다.
      containers:
        - name: backend-record
          image: backend-record
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          # AWS_REGION 을 명시적으로 고정한다. EKS IRSA(pod-identity) 웹훅이
          # 파드에 클러스터 리전(ap-northeast-2)을 AWS_REGION 으로 주입하는데,
          # Bedrock Qwen3-VL 모델은 us-east-1 에만 있어 그대로 두면 Converse 가
          # "invalid model identifier" 로 실패한다. 명시적 env 는 webhook 주입과
          # envFrom(configmap)보다 우선하므로 여기서 강제한다.
          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
          envFrom:
            - configMapRef:
                name: backend-record-config
            - secretRef:
                name: backend-record-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
