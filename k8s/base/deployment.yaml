apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-record
  labels:
    app.kubernetes.io/name: backend-record
spec:
  # replicas 는 overlay 에서 환경별로 지정 (dev=1, prod=2 — prod 는 현재 주석 상태)
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-record
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-record
    spec:
      # IRSA: 위 ServiceAccount(backend-record)에 연결된 IAM Role 로
      # AWS Bedrock 을 호출한다. Secret 의 정적 AWS 키는 더 이상 불필요.
      serviceAccountName: backend-record
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      # CLIAR-123: backend-record는 CLOVA OCR 전용 서비스로, Scrap 저장을
      # 포함한 PostgreSQL 데이터 소유 책임이 없다(CLIAR-121). 따라서 Pod
      # 시작 전 Alembic migration을 수행하는 initContainer를 제거했다.
      # FastAPI container는 DB migration 성공 여부와 무관하게 시작된다.
      containers:
        - name: backend-record
          image: backend-record
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-record-config
            - secretRef:
                name: backend-record-secret
          # CLIAR-201: OpenTelemetry Resource 에 담을 실행 환경(Pod) 정보.
          # observability 초기화 코드가 POD_NAME/POD_NAMESPACE/NODE_NAME 을
          # 읽어 k8s.* resource attribute 로 사용한다. (없어도 정상 동작)
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
