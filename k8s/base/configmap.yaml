apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-record-config
  labels:
    app.kubernetes.io/name: backend-record
# 민감하지 않은 설정값만 여기에 둡니다.
# DB 접속정보, AWS 자격증명 등 비밀값은 Secret 에 둡니다.
data:
  APP_ENV: "production"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  # Bedrock 전용 호출 리전. 파드의 AWS_REGION(서울)과 분리한다.
  # Qwen3-VL 모델이 us-east-1 에만 있어 여기서 지정한다.
  BEDROCK_REGION: "us-east-1"
  BEDROCK_OCR_MODEL_ID: "qwen.qwen3-vl-235b-a22b"
  # RECORD-1: 스크랩 이미지 업로드 대상 S3 버킷.
  SCRAP_S3_BUCKET: "dpyb-scrap-image"
  # RECORD-2: 스크랩 이미지를 서비스하는 CloudFront 도메인.
  SCRAP_CLOUDFRONT_DOMAIN: "d3qnwig98jio0e.cloudfront.net"
