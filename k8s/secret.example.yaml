# ⚠️ 이 파일은 "예시" 입니다. 실제 비밀값을 여기에 적어 Git 에 커밋하지 마세요.
# ArgoCD Application 에서 *.example.yaml 은 제외하도록 설정되어 있습니다.
#
# 실제 Secret 생성 방법 (택 1):
#
# 1) kubectl 로 직접 생성 (가장 간단, 클러스터에만 존재하고 Git 에는 안 올라감)
#    kubectl create secret generic backend-record-secret \
#      --namespace dpyb-record-dev \
#      --from-literal=CLOVA_OCR_INVOKE_URL='https://xxxxx.apigw.ntruss.com/custom/v1/00000/xxxxxxxx/general' \
#      --from-literal=CLOVA_OCR_SECRET_KEY='xxxxxxxx'
#
# 2) SealedSecrets / External Secrets Operator 를 써서 암호화된 형태로 Git 관리 (권장, 운영환경)
#    - SealedSecrets: kubeseal 로 암호화한 SealedSecret 을 커밋
#    - External Secrets: AWS Secrets Manager / SSM Parameter Store 와 연동
#
# CLIAR-123: backend-record는 CLOVA OCR 전용 서비스로 PostgreSQL 데이터를
# 소유하지 않으므로(CLIAR-121) DATABASE_URL을 더 이상 배포 Secret에 포함하지
# 않습니다. Scrap 등 데이터 저장은 backend-book/Library 서비스가 담당합니다.
#
# 아래는 참고용 구조입니다.
apiVersion: v1
kind: Secret
metadata:
  name: backend-record-secret
  namespace: dpyb-record-dev
  labels:
    app.kubernetes.io/name: backend-record
type: Opaque
stringData:
  CLOVA_OCR_INVOKE_URL: "https://<invoke-url>.apigw.ntruss.com/custom/v1/<id>/<secret>/general"
  CLOVA_OCR_SECRET_KEY: "<clova-ocr-secret-key>"
