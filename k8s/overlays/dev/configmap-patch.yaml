# 개발 환경에서 base ConfigMap 위에 덮어쓸 값
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-record-config
data:
  APP_ENV: "development"
  # 내부 서비스 엔드포인트(비민감). dev 클러스터 ELB 주소.
  # AUTH_API: backend-auth 회원 조회(settings.AUTH_API, 필수값). 없으면 앱 기동 실패.
  # BOOK_API: 현재 앱 코드에서 미사용이나 향후 backend-book 연동 대비로 함께 주입.
  AUTH_API: "http://k8s-dpybauth-backenda-c303977024-255533103.ap-northeast-2.elb.amazonaws.com"
  BOOK_API: "http://k8s-dpybbook-backendb-d17a725d36-1113312703.ap-northeast-2.elb.amazonaws.com"
  DISCOVERY_API: "http://k8s-dpybdisc-backendd-bc2eec8a3f-1704260439.ap-northeast-2.elb.amazonaws.com"

  # --- Observability (CLIAR-201): OpenTelemetry 분산 트레이싱 (dev) ---
  # OTEL_EXPORTER_OTLP_ENDPOINT 가 있을 때만 exporter 가 활성화된다.
  # dpgy-infra 의 OTel Collector(OTLP HTTP) → Grafana Tempo 로 전송된다.
  OTEL_SERVICE_NAME: "backend-record"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  # parentbased_traceidratio 샘플러 비율. dev 는 전량 샘플링(1.0).
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  # GenAI(Bedrock) 프롬프트/이미지 본문을 span 에 절대 남기지 않는다(민감정보 보호).
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"

  # --- Observability: Prometheus HTTP 메트릭 (dev) ---
  # infra Prometheus 가 ServiceMonitor(backend-record / dpyb-record-dev)로
  # /metrics 를 30s 간격 스크레이핑한다. Micrometer 호환 메트릭
  # http_server_requests_seconds_{count,bucket,sum} 를 application="backend-record"
  # 라벨로 노출한다(= OTEL_SERVICE_NAME).
  METRICS_ENABLED: "true"
  # Micrometer 에 없는 *_created 시계열을 노출하지 않아 출력/카디널리티를 줄인다.
  PROMETHEUS_DISABLE_CREATED_SERIES: "true"
