apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 개발 환경 (develop 브랜치 → dpyb-record-dev 네임스페이스)
namespace: dpyb-record-dev

resources:
  - ../../base

# 개발은 1개만
replicas:
  - name: backend-record
    count: 1

# 개발용 이미지. CI 가 newTag 를 커밋 SHA 로 갱신합니다.
images:
  - name: backend-record
    newName: 594532711953.dkr.ecr.ap-northeast-2.amazonaws.com/dpyb-dev/dpyb-record
    newTag: a1b0e0f888f26a8e8087741a46840f2153b18e81

# 개발 환경에서 달라지는 설정값만 덮어씀
patches:
  - path: configmap-patch.yaml
